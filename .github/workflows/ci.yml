name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-hygiene:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML for frontmatter validation
        run: python -m pip install pyyaml

      - name: Run unit, E2E scaffolding, and zero-leakage suite
        run: python -B -m unittest discover -s tests -v

      - name: Smoke-test Hub resolver & dry-run scaffolder
        run: |
          python -B skills/second-brain/scripts/resolve_obsi_hub.py --cwd . --json
          python -B skills/obsi-setup/scripts/scaffold_brain.py --vault ./smoke-vault --lang en --dry-run
