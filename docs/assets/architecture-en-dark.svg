<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="Obsi Founder Compass 5-Layer Hub-and-Spoke Architecture (Dark)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <style>
      .title { font-family: Segoe UI, Tahoma, Vazirmatn, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .tag { font-family: Segoe UI, Tahoma, Vazirmatn, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .cmd { font-family: Consolas, Menlo, Monaco, monospace; font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .sub { font-family: Segoe UI, Tahoma, Vazirmatn, Arial, sans-serif; font-size: 11px; fill: #9ca3af; }
      .foot { font-family: Segoe UI, Tahoma, Vazirmatn, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      .line { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="778" height="428" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Hub -->
  <rect x="200" y="20" width="380" height="66" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="390" y="47" text-anchor="middle" class="title">🧭 /obsi — 5-Layer Smart Hub &amp; Layer 3 Ops</text>
  <text x="390" y="69" text-anchor="middle" class="sub">Auto-detects project · Clickable palette · /obsi next &amp; /obsi done</text>

  <!-- Connectors Hub -> Layers -->
  <path d="M 390 86 L 390 112" class="line"/>
  <path d="M 103 112 L 677 112" class="line"/>
  <path d="M 103 112 L 103 135" class="line" marker-end="url(#arrow)"/>
  <path d="M 294 112 L 294 135" class="line" marker-end="url(#arrow)"/>
  <path d="M 486 112 L 486 135" class="line" marker-end="url(#arrow)"/>
  <path d="M 677 112 L 677 135" class="line" marker-end="url(#arrow)"/>

  <!-- Layer 0 -->
  <rect x="18" y="138" width="170" height="102" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="103" y="160" text-anchor="middle" class="tag" fill="#3fb950">LAYER 0 · SETUP</text>
  <text x="103" y="184" text-anchor="middle" class="cmd">/obsi-setup</text>
  <text x="103" y="206" text-anchor="middle" class="sub">4-question wizard</text>
  <text x="103" y="224" text-anchor="middle" class="sub">EN Mon-Sun · FA Sat-Fri</text>

  <!-- Layer 1 -->
  <rect x="209" y="138" width="170" height="102" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="294" y="160" text-anchor="middle" class="tag" fill="#d29922">LAYER 1 · STRATEGY</text>
  <text x="294" y="184" text-anchor="middle" class="cmd">/obsi-consult</text>
  <text x="294" y="206" text-anchor="middle" class="sub">Vision Mirror Gate</text>
  <text x="294" y="224" text-anchor="middle" class="sub">No-Code · Macro Gaps</text>

  <!-- Layer 2 -->
  <rect x="401" y="138" width="170" height="102" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="486" y="160" text-anchor="middle" class="tag" fill="#bc8cff">LAYER 2 · COHORTS</text>
  <text x="486" y="184" text-anchor="middle" class="cmd">/obsi-priority</text>
  <text x="486" y="206" text-anchor="middle" class="sub">14d Scale / Pivot / Kill</text>
  <text x="486" y="224" text-anchor="middle" class="sub">Advisory pacing choices</text>

  <!-- Layer 4 -->
  <rect x="592" y="138" width="170" height="102" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="677" y="160" text-anchor="middle" class="tag" fill="#f78166">LAYER 4 · AUDITOR</text>
  <text x="677" y="184" text-anchor="middle" class="cmd">/obsi-inspect</text>
  <text x="677" y="206" text-anchor="middle" class="sub">Delta transcript audit</text>
  <text x="677" y="224" text-anchor="middle" class="sub">1s Vault health check</text>

  <!-- Connectors Layers -> Engines -->
  <path d="M 103 240 L 103 288" class="line" marker-end="url(#arrow)"/>
  <path d="M 486 240 L 486 260 L 175 260 L 175 288" class="line" marker-end="url(#arrow)"/>
  <path d="M 294 240 L 294 270 L 390 270 L 390 288" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 677 240 L 677 270 L 647 270 L 647 288" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Engine 0: Vault -->
  <rect x="18" y="291" width="230" height="102" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="133" y="317" text-anchor="middle" class="title">🗂️ Native Obsidian Bases</text>
  <text x="133" y="340" text-anchor="middle" class="sub">Today · Weekly · Cohorts · Projects</text>
  <text x="133" y="359" text-anchor="middle" class="sub">L3 done -&gt; unlocks Locked tasks</text>
  <text x="133" y="378" text-anchor="middle" class="sub">100% local Markdown + Git</text>

  <!-- Engine 1: Playbook Cache + Scorecards -->
  <rect x="275" y="291" width="230" height="102" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="390" y="317" text-anchor="middle" class="title">🧠 Strategy Memory Engine</text>
  <text x="390" y="340" text-anchor="middle" class="sub">Playbook Cache (90-day TTL)</text>
  <text x="390" y="359" text-anchor="middle" class="sub">Living Scorecards (Route B resume)</text>
  <text x="390" y="378" text-anchor="middle" class="sub">Zero duplicate web searches</text>

  <!-- Engine 2: Inspector + Auditor -->
  <rect x="532" y="291" width="230" height="102" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
  <text x="647" y="317" text-anchor="middle" class="title">🔍 Truth &amp; Integrity Engine</text>
  <text x="647" y="340" text-anchor="middle" class="sub">extract_session_steps.py (delta)</text>
  <text x="647" y="359" text-anchor="middle" class="sub">vault_audit.py (YAML + links + .base)</text>
  <text x="647" y="378" text-anchor="middle" class="sub">Zero hallucinated strategy claims</text>

  <text x="390" y="414" text-anchor="middle" class="foot">Zero community plugins · Silent in normal coding chats · Proposal-first writes</text>
</svg>
